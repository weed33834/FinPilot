# FinPilot 前端 nginx 配置
# - 静态托管 Vite 构建产物
# - /api /ws 反向代理到后端容器（service name: backend，端口 8001）
# - SPA history 模式兜底：所有未匹配路由回落到 index.html

server {
    listen       80;
    server_name  _;

    # 静态产物
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩，减小前端传输体积
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 上传体积上限（与后端文档/报告上传对齐）
    client_max_body_size 50m;

    # 反向代理后端 API（含 /api/v1/*）
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 trace_id，与后端 trace_middleware 对齐
        proxy_pass_request_headers on;
    }

    # WebSocket 反向代理（/ws/notifications）
    location /ws/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # SPA history 模式：未命中静态文件的路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 hash 文件名，可安全长缓存）
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
